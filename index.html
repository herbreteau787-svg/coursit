<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoursIT — chargement de l'application…</title>
    <meta name="description" content="Plateforme de révision TSSR · AIS · CCNA 200-301. Cette page charge l'application compilée (Vite).">
    <meta http-equiv="refresh" content="2;url=app/dist/index.html">
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { max-width: 560px; background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 32px; text-align: center; }
        h1 { font-size: 1.25rem; margin: 0 0 8px; color: #7dd3fc; }
        p { font-size: 0.85rem; color: #94a3b8; line-height: 1.6; }
        a { color: #38bdf8; text-decoration: none; font-weight: 600; }
        a:hover { text-decoration: underline; }
        code { background: #0f172a; padding: 2px 6px; border-radius: 4px; font-size: 0.78rem; color: #86efac; }
        .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid #334155; border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.9s linear infinite; margin-bottom: 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
        // Redirection immédiate si le build local existe
        window.addEventListener('DOMContentLoaded', function () {
            fetch('app/dist/index.html', { method: 'HEAD' })
                .then(function (r) { if (r.ok) location.replace('app/dist/index.html'); })
                .catch(function () { /* le lien de secours reste visible */ });
        });
    </script>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h1>CoursIT</h1>
        <p>
            Redirection vers l'application compilée…
            Si rien ne se passe :
        </p>
        <p>
            <a href="app/dist/index.html">Ouvrir la version locale</a><br>
            <a href="https://herbreteau787-svg.github.io/coursit/" target="_blank" rel="noopener">Voir la version en ligne</a>
        </p>
        <p>
            En local, si le lien échoue, compilez d'abord l'application :<br>
            <code>cd app &amp;&amp; npm install &amp;&amp; npm run build</code>
        </p>
    </div>
</body>
</html>
