            { type: "Windows Server", en: "deployment share", fr: "partage de déploiement", def: "Emplacement réseau hébergeant images, pilotes et scripts d'un MDT/WDS.", exEn: "The deployment share offers the PE boot image over the network.", exFr: "Le partage de déploiement expose l'image PE boot par le réseau." },
            { type: "Windows Server", en: "boot image", fr: "image d'amorçage (boot.wim)", def: "Image WinPE qui amorce le poste avant d'appeler l'installeur du vrai OS (install.wim).", exEn: "Point the client to the boot image over PXE.", exFr: "Dirige le client vers l'image d'amorçage en PXE." },
            { type: "Windows Server", en: "task sequence", fr: "séquence de tâches (deployment TS)", def: "Chemin systématique d'installation : partitionnement, OS, pilotes, applications, ordre et conditions.", exEn: "Every TS step can pause for troubleshooting.", exFr: "Chaque étape de séquence peut se suspendre pour le debugging." },
            { type: "Windows Server", en: "trust relationship", fr: "relation d'approbation entre domaines", def: "Lien de confiance entre domaines ET forêts permettant d'apprendre les identités côté partenaire.", exEn: "A trust relationship lets both domains call each other's users.", exFr: "Une relation d'approbation autorise chaque domaine à reconnaître les utilisateurs de l'autre." },
            { type: "Windows Server", en: "password policy", fr: "stratégie de mot de passe", def: "Règles de complexité, longueur et durée de vie appliquées par GPO sur l'annuaire.", exEn: "Baseline password policy: 14 chars, complexity on.", exFr: "La politique de base : 14 caractères avec complexité." },
            { type: "Windows Server", en: "Fine-Grained Password Policy", fr: "politique de mot de passe fine-grained (PSO)", def: "Politique de mot de passe spécifique à un groupe (admins, comptes de service) au sens AD.", exEn: "PSOs apply finer settings than domain policy.", exFr: "Les PSO affinent les réglages au-delà de la politique du domaine." },
            { type: "Linux", en: "package repository", fr: "dépôt de paquets", def: "Source signée (apt sources.list ou dnf .repo) d'où le gestionnaire de paquets télécharge les logiciels.", exEn: "Add the repo key before the first apt update.", exFr: "Ajoute la clé du dépôt avant le premier apt update." },
            { type: "Linux", en: "dependency", fr: "dépendance", def: "Paquet requis par un autre paquet ; le gestionnaire les résout automatiquement.", exEn: "Every package declares its dependencies for the manager.", exFr: "Chaque paquet déclare ses dépendances au gestionnaire." },
            { type: "Linux", en: "service unit", fr: "unité systemd de service", def: "Fichier .systemd décrivant un service (ExecStart, After=, Restart=).", exEn: "Copy the unit to /etc/systemd/system to override defaults.", exFr: "Copiez l'unité dans /etc/systemd/system sur les valeurs du système." },
            { type: "Linux", en: "cron schedule", fr: "planification cron", def: "5 champs (minute, heure, jour-mois, mois, jour-semaine) puis commande, exécutée par cron.", exEn: "A cron schedule of 30 3 * * * runs at 3:30 a.m.", exFr: "Un cron « 30 3 * * * » tourne chaque nuit à 3 h 30." },
            { type: "Linux", en: "symbolic link", fr: "lien symbolique", def: "Entrée (ln -s) pointant vers un autre fichier/dossier, traversable entre partitions.", exEn: "A symlink to /mnt/share keeps the config path stable.", exFr: "Un lien vers /mnt/share garde le chemin de config stable." },
            { type: "Linux", en: "mount point", fr: "point de montage", def: "Dossier où un système de fichiers se raccroche à l'arborescence (mount, fstab).", exEn: "Add an fstab mount point for the data disk.", exFr: "Ajoute un point de montage fstab pour le disque de données." },
            { type: "Linux", en: "bootloader", fr: "chargeur de démarrage", def: "Premier code lancé après le firmware (GRUB, syslinux) qui charge le noyau et l'initrd.", exEn: "The bootloader menu lists every installed kernel.", exFr: "Le menu du bootloader liste les noyaux installés." },
            { type: "Linux", en: "kernel module", fr: "module noyau", def: "Extension du noyau chargée à la demande (lsmod, modprobe) pour un pilote matériel ou une fonction.", exEn: "Load the right kernel module for the NIC.", exFr: "Charge le module noyau adapté à la carte réseau." },
            { type: "Linux", en: "disk image", fr: "image de disque", def: "Copie octet par octet d'un disque ou volume (dd), utile pour le clonage et les examens forensiques.", exEn: "Catch a disk image before the hardware swap.", exFr: "Prends une image du disque avant la permutation matériel." },
            { type: "Linux", en: "runlevel", fr: "runlevel (précurseur des targets)", def: "Mode de démarrage Sys V : 1 mono-user, 3 multi-user, 5 graphique ; remplacé par les targets systemd.", exEn: "Runlevel 3 shuts out the graphical mode.", exFr: "Le runlevel 3 exclut le mode graphique." },
            { type: "Linux", en: "man page", fr: "page de manuel", def: "Documentation intégrée d'une commande (man ls, man 5 crontab), source de vérité locale.", exEn: "Read the man page before guessing a flag.", exFr: "Lit le manuel avant de deviner une option." },
            { type: "Active Directory", en: "domain controller", fr: "contrôleur de domaine (DC)", def: "Serveur hébergeant la base NTDS.dit et répondant aux demandes Kerberos/DNS du domaine.", exEn: "Two domain controllers keep the domain alive if one fails.", exFr: "Deux DC maintiennent le domaine si l'un tombe." },
            { type: "Active Directory", en: "schema", fr: "schéma AD", def: "Définition des classes d'objets et attributs possibles (une seule instance par forêt).", exEn: "A schema extension adds a custom attribute to every user.", exFr: "Une extension du schéma ajoute un attribut personnalisé aux utilisateurs." },
            { type: "Active Directory", en: "FSMO role", fr: "rôle FSMO", def: "Rôle opérationnel unique (PDC, RID, infrastructure, schéma, nommage) distribué entre DC.", exEn: "Transfer FSMO roles before you retire the original DC.", exFr: "Transfère les FSMO avant de retirer l'ancien DC." },
            { type: "Active Directory", en: "group policy inheritance", fr: "héritage des GPO", def: "Application des GPO du plus haut niveau (domaine) aux niveaux enfants (UO), avec priorité en cascade.", exEn: "Block inheritance on the OU to isolate the kiosk policy.", exFr: "Bloque l'héritage sur l'UO pour isoler la politique kiosque." },
            { type: "Active Directory", en: "OU nesting", fr: "imbrication d'UO", def: "Structure arborescente d'unités d'organisation servant de conteneurs d'application aux GPO.", exEn: "OU nesting mirrors the org chart for targeted GPOs.", exFr: "L'imbrication des UO reflète l'organigramme pour cibler les GPO." },
            { type: "Active Directory", en: "security identifier (SID)", fr: "identifiant de sécurité (SID)", def: "Identifiant unique de chaque compte/groupe, base interne des ACL.", exEn: "Renaming a user does not change the SID.", exFr: "Renommer un compte ne change pas son SID." },
            { type: "Active Directory", en: "krbtgt", fr: "krbtgt", def: "Compte machine de clé Kerberos, cible des attaques de type golden ticket (à surveiller et rotaté lors d'un compromis).", exEn: "A golden ticket attack abuses the krbtgt hash.", exFr: "Une attaque golden ticket abuse de la clé krbtgt." },
            { type: "Active Directory", en: "delegation", fr: "délégation admin", def: "Droits limités confiés à un groupe d'administrateurs locaux sur une UO, sans droits de domaine.", exEn: "Delegate the password reset to the help desk group.", exFr: "Délègue le reset de mot de passe au service d'assistance." },
            { type: "Active Directory", en: "lockout policy", fr: "politique de verrouillage de compte", def: "Nombre d'échecs et durée de blocage avant qu'un compte ne soit temporairement refusé.", exEn: "Lockout policy set at 5 attempts for 15 minutes.", exFr: "Verrouillage après 5 tentatives pendant 15 min." },
            { type: "Active Directory", en: "group nesting", fr: "imbrication de groupes", def: "Inclusion de groupes dans des groupes (GG dans DL en AGDLP) pour factoriser les droits.", exEn: "Nest the GG into the right DL for the share.", exFr: "Place la GG dans la DL appropriée du partage." },
            { type: "Virtualisation", en: "bare-metal hypervisor", fr: "hyperviseur natif (type 1)", def: "Hyperviseur qui s'installe directement sur le matériel (ESXi, Hyper-V Server) sans OS intermédiaire.", exEn: "A bare-metal hypervisor runs the hosts clusters rely on.", exFr: "Un hyperviseur natif porte les clusters sans hôte intermédiaire." },
            { type: "Virtualisation", en: "VM snapshot", fr: "instantané de VM", def: "Image figée d'un disque virtuel à un instant, perplexe pour retourner à l'état d'avant migration.", exEn: "Take a VM snapshot before you applied the patch.", exFr: "Prends un snapshot avant les patchs appliqués." },
            { type: "Virtualisation", en: "nested virtualization", fr: "imbrication des hyperviseurs", def: "Migration d'un hyperviseur dans un hyperviseur (type 1 dans type 1), utile pour tester des labs.", exEn: "Enable nested virtualization on the lab host.", exFr: "Active la virtualisation imbriquée sur l'hôte lab." },
            { type: "Virtualisation", en: "VM template", fr: "gabarit de VM", def: "Modèle en lecture seule reprenant l'OS, les drivers et les paramètres pour créer de nouvelles VM.", exEn: "Build a template VM for each OS baseline.", exFr: "Construisez un gabarit de VM par OS de base." },
            { type: "Virtualisation", en: "virtual switch", fr: "commutateur virtuel", def: "Switch logiciel de l'hyperviseur reliant VM, cartes physiques et VLAN tags sur l'hôte.", exEn: "Tag the VLANs directly on the virtual switch.", exFr: "Balisages VLAN directement sur le commutateur virtuel." },
            { type: "Virtualisation", en: "thin provisioning", fr: "provisionnement fin (thin)", def: "Allocation de disque à la demande, déchargée progressivement jusqu'à la capacité maximale.", exEn: "Thin provisioning saves disk space immediately.", exFr: "Le thin provisioning économe le disque sans sur-allocation." },
            { type: "Virtualisation", en: "OVF / OVA", fr: "format d'export de VM (OVF / OVA)", def: "Format d'export/import standard d'une VM (fichiers OVF, ou OVA packagé en une seule archive).", exEn: "Export OVH machines in OVA for a one-click import.", exFr: "Exportez les VM en OVA pour un import en un clic." },
            { type: "Cybersécurité", en: "risk register", fr: "registre des risques", def: "Table qui liste chaque risque identifié avec sa criticité, sa probabilité et son traitement.", exEn: "The risk register tracks every risk to score.", exFr: "Le registre des risques liste chaque risque noté." },
            { type: "Cybersécurité", en: "penetration test", fr: "test d'intrusion (pentest)", def: "Simulation contrôlée de menaces pour identifier les failles exploitables, au priorité selon le scope.", exEn: "Schedule a pentest before the public site launch.", exFr: "Planifiez un pentest avant le lancement du site public." },
            { type: "Cybersécurité", en: "red team / blue team", fr: "équipe offensive (rouge) / défensive (bleu)", def: "Équipe qui attaque (red) contre celle qui défend (blue team) dans un exercice de sécurité.", exEn: "The red team staged a phishing drill on the blue team.", exFr: "L'équipe red a lancé un exercice de phishing sur les blue team." },
            { type: "Cybersécurité", en: "social engineering", fr: "ingénierie sociale", def: "Manipulation de l'humain (call-back voluntara, phishing) en dehors des attaques purement techniques.", exEn: "Social engineering dodges the tech perimeter.", exFr: "L'ingénierie sociale contourne le périmètre technique." },
            { type: "Cybersécurité", en: "ransomware", fr: "rançongiciel", def: "Malware chiffrant les données pour exiger une rançon ; nécessite sauvegardes déconnectées et immuables.", exEn: "The ransomware hit the file server on Friday night.", exFr: "Le rançongiciel a frappé le serveur de fichiers vendredi soir." },
            { type: "Cybersécurité", en: "vulnerability scan", fr: "scan de vulnérabilités", def: "Balayage automatique des services/ports à la recherche de failles connues (Nessus, OpenVAS) ; moins intrusif qu'un pentest.", exEn: "Run a vulnerability scan every month on the DMZ.", exFr: "Fais un scan de vulnérabilités mensuel sur la DMZ." },
            { type: "Cybersécurité", en: "patch management", fr: "gestion des correctifs", def: "Process de réception, test, planification et déploiement des mises à jour de sécurité (WSUS, dnf, apt, etc.).", exEn: "Patch management SLA — critical fixes within 72 h.", exFr: "Le SLA de correctifs — critiques sous 72 h." },
            { type: "Cybersécurité", en: "kill chain", fr: "chaîne d'attaque", def: "Étapes d'une intrusion (reconnaissance, exploitation, persistance, exfiltration) à interrompre au plus tôt.", exEn: "Break the kill chain at the delivery stage.", exFr: "Cassez la chaîne d'attaque à l'étape de livraison." },
            { type: "Cybersécurité", en: "indicators of compromise", fr: "indicateurs de compromission (IOC)", def: "Signatures techniques (hashes, IPs, mastering) attestant d'une intrusion observée.", exEn: "Alert on the listed indicators of compromise.", exFr: "Alerte sur les indicateurs de compromission listés." },
            { type: "Cloud", en: "region", fr: "région cloud", def: "Zone géographique d'un cloud public : les ressources se déploient dans une région pour la latence et la souveraineté.", exEn: "Choose the closest region for latency.", exFr: "Choisis la région la plus proche pour la latence." },
            { type: "Cloud", en: "availability zone", fr: "zone de disponibilité", def: "Site physique isolé au sein d'une région : risque ambiant partagé sur plusieurs zones.", exEn: "Spread the VMs across two availability zones.", exFr: "Répartis les VM sur deux zones de disponibilité." },
            { type: "Cloud", en: "scale out / scale in", fr: "mise à l'échelle horizontale", def: "Ajout/retrait d'instances (plutôt qu'augmenter la taille d'une seule), dépendance automatique.",
                exEn: "Scale out the app pool during peak hours.", exFr: "Prends des instances du pool d'appli aux heures de pointe."},
            { type: "Cloud", en: "serverless", fr: "serverless (sans serveur)", def: "Exécution de code facturée au temps réel, sans gestion de serveur (Functions).", exEn: "Go serverless for the webhook receiver.", exFr: "Passe en serverless pour le récepteur webhook." },
            { type: "Cloud", en: "managed service", fr: "service managé", def: "Service cloud géré par le fournisseur (base de données, cluster Kubernetes) : l'utilisateur gère la donnée, pas l'infrastructure.", exEn: "Prefer a managed database for the team's small project.", exFr: "Préfère une base de données managée pour ce petit projet." },
            { type: "Cloud", en: "hybrid cloud", fr: "cloud hybride", def: "Solutions combinant infrastructure locale et cloud public, souvent via VPN ou express route.", exEn: "A hybrid cloud keeps the AD on-prem.", exFr: "Le cloud hybride garde l'AD séparé localement." },
            { type: "Cloud", en: "SaaS", fr: "logiciel en service (SaaS)", def: "Application consommée à la demande, sans administration d'infra (Microsoft 365, Teams).", exEn: "Office 365 is a SaaS platform.", exFr: "Office 365 est un SaaS." },
            { type: "Cloud", en: "IaaS", fr: "infrastructure en service (IaaS)", def: "Machines, disques et réseaux virtuels fournis par le cloud dont on garde le contrôle des OS.", exEn: "Use IaaS to host the legacy ERP server.", exFr: "Utilise l'IaaS pour héberger l'ERP ancien." },
            { type: "Cloud", en: "PaaS", fr: "plateforme en service (PaaS)", def: "Plateforme d'exécution pré-configurée (App Service) : le développeur livre le code, le service gère l'OS/middleware.", exEn: "PaaS platforms hide the patching cycle.", exFr: "Les PaaS cachent la charge des patchs." },
            { type: "Cloud", en: "tenant isolation", fr: "isolation de tenant", def: "Garantie que les tenants d'un cloud mutualisé n'ont pas accès aux données et ressources les uns des autres.", exEn: "Tenant isolation is audited by the provider.", exFr: "L'isolation de tenant est auditée par le fournisseur." },
            { type: "Sauvegarde", en: "backup window", fr: "fenêtre de sauvegarde", def: "Intervalle horaire autorisé pour lancer les sauvegardes sans impacter la production.", exEn: "Keep the backup window under two hours.", exFr: "Garde la fenêtre de sauvegarde sous deux heures." },
            { type: "Sauvegarde", en: "retention policy", fr: "politique de rétention", def: "Durée de conservation des sauvegardes (7 jours, 4 semaines, 12 mois) selon le contrat et la loi.", exEn: "The retention policy keeps monthly copies for one year.", exFr: "La rétention garde une copie mensuelle pendant un an." },
            { type: "Sauvegarde", en: "incremental forever", fr: "incrémental à vie", def: "Méthode où, après une sauvegarde complète initiale, seuls les incrémentales se cumulent, reconstitués au moment de la restauration.", exEn: "Incremental forever speeds up the nightly run.", exFr: "L'incrémental à vie accélère la sauvegarde nocturne." },
            { type: "Sauvegarde", en: "synthetic backup", fr: "sauvegarde synthétique", def: "Fusion en ligne de sauvegardes connexes pour fabriquer une copie complète sans solliciter la machine source (Veeam).", exEn: "A synthetic full runs on the backup server, not the VM.", exFr: "Une complète synthétique court sur le serveur de backup, pas la VM." },
            { type: "Sauvegarde", en: "bare-metal restore", fr: "restauration bare-metal (BMR)", def: "Réinstallation complète depuis la sauvegarde (OS, drivers, données) sur une machine vide (image système).", exEn: "A BMR brings the server back without reinstall discs.", exFr: "Une BMR ramène le serveur sans disque d'installation." },
            { type: "Sauvegarde", en: "restore drill", fr: "exercice de restauration", def: "Répétition planifiée d'une restauration pour prouver leur fiabilité (le seul vrai test des sauvegardes).", exEn: "Do a restore drill every quarter.", exFr: "Fais un exercice de restauration chaque trimestre." },
            { type: "Sauvegarde", en: "immutable backup", fr: "sauvegarde immuable", def: "Sauvegarde protégée contre la modification ou la suppression pendant une période (WORM, immutability period).", exEn: "Keep an immutable backup for the ransomware plan.", exFr: "Garde une sauvegarde immuable dans le plan ransomware." },
            { type: "Sauvegarde", en: "replica", fr: "réplica (réplication VM)", def: "Copie synchronisée d'une VM prête à démarrer sur un autre hôte/ssetItem, utilisée pour le failover.", exEn: "Failover to the replica when the primary VM dies.", exFr: "Bascule sur le réplica quand la VM principale s'arrête." },
            { type: "Supervision", en: "alert threshold", fr: "seuil d'alerte", def: "Valeur franchie déclenchant une notification (CPU > 90 %, disque > 85 %), à calibrer avec l'historique.", exEn: "Set the alert threshold on the real historic values.", exFr: "Calibre le seuil sur l'historique réel." },
            { type: "Supervision", en: "severity level", fr: "niveau de gravité", def: "Qualification des alertes (info, avertissement, critique) qui pilote la priorité de traitement.", exEn: "Only critical alerts page the on-call.", exFr: "Seules les alertes critiques déclenchent l'astreinte." },
            { type: "Supervision", en: "escalation policy", fr: "politique d'escalade", def: "Règles de transmission d'une alerte non traitée à l'équipe supérieure ou de garde.", exEn: "Unacknowledged alerts follow the escalation policy.", exFr: "Les alertes non accusées suivent la politique d'escalade." },
            { type: "Supervision", en: "service discovery", fr: "découverte de service", def: "Découverte automatique des éléments à surveiller (interfaces, disques) d'après les serveurs (LLD Zabbix).", exEn: "Service discovery adds each new disk automatically.", exFr: "La découverte de service intègre chaque nouveau disque." },
            { type: "Supervision", en: "synthetic monitoring", fr: "supervision synthétique", def: "Surveillance simulée d'un service (connexion web régulière) pour détecter les pannes avant les utilisateurs.", exEn: "Synthetic monitoring pings the login page every minute.", exFr: "La supervision synthétique teste la page de login chaque minute." },
            { type: "Supervision", en: "log aggregation", fr: "centralisation des journaux", def: "Collecte des logs d'équipements vers un serveur central (rsyslog, SIEM) pour corrélation et conservation.", exEn: "Send all device logs to the log aggregation server.", exFr: "Envoi tous les logs vers le serveur de centralisation." },
            { type: "Supervision", en: "capacity planning", fr: "vérification de capacité", def: "Analyse des tendances (stockage, CPU, licences) pour anticiper les investissements.", exEn: "Capacity planning behind a 6-month trend chart.", exFr: "La capacité se planifie derrière un graphe de tendance."
            },
            { type: "DevOps", en: "continuous integration", fr: "intégration continue (CI)", def: "Fusion répétée du code avec tests automatiques à chaque commit (pipeline).", exEn: "CI runs the test suite on every push.", exFr: "La CI lance les tests à chaque push." },
            { type: "DevOps", en: "continuous deployment", fr: "déploiement continu (CD)", def: "Livraison automatique des versions testées en production (ou pre-prod) après passage de CI.", exEn: "CD brings the build to the dev sandbox.", exFr: "Le CD met en place le build sur le sandbox dev." },
            { type: "DevOps", en: "pipeline", fr: "pipeline (chaîne de build)", def: "Enchaînement codé d'étapes build-test-deploy exécuté automatiquement.", exEn: "The pipeline failed at the lint step.", exFr: "Le pipeline a échoué à l'étape lint." },
            { type: "DevOps", en: "artifact", fr: "artefact (livrable de build)", def: "Sortie versionnée d'une étape de build (binaire, archive) à promouvoir d'environnement en environnement.", exEn: "Each pipeline run produces a versioned artifact.", exFr: "Chaque run du pipeline produit un artefact versionné." },
            { type: "DevOps", en: "rollback", fr: "retour arrière (rollback)", def: "Reprise de la version précédente après un déploiement défectueux.", exEn: "Rollback to the previous release if the regression persists.", exFr: "Rollback à la version précédente si la régression se maintient." },
            { type: "DevOps", en: "feature flag", fr: "interrupteur de fonctionnalité", def: "Variable qui active/désactive une fonctionnalité en production sans redéploiement.", exEn: "The feature flag protects the rollout.", exFr: "Le feature flag protège la mise en production." },
            { type: "DevOps", en: "secret management", fr: "gestion des secrets", def: "Stockage chiffré de mots de passe/clés d'authentification utilisés par les pipelines et services (Vault).", exEn: "Never put secrets in plain code — use the vault.", exFr: "Ne range jamais les secrets dans le code — passe par le coffre." },
            { type: "DevOps", en: "infrastructure drift", fr: "dérive de configuration", def: "Écart entre l'état réel d'une infrastructure et son modèle IaC corrigé par l'exécution.", exEn: "Ansible runs weekly to fix infrastructure drift.", exFr: "Ansible tourne chaque semaine pour corriger la dérive." },
            { type: "ITIL", en: "incident", fr: "incident", def: "Évènement non planifié qui interrompt ou dégrade un service ; objet standard du ticketing.", exEn: "Log the incident within 15 minutes.", exFr: "Enregistre l'incident sous 15 minutes." },
            { type: "ITIL", en: "problem", fr: "problème (ITIL)", def: "Cause racine d'un ou plusieurs incidents récidivants, à traiter par analyse et root cause.", exEn: "Three incidents trace back to the same problem record.", exFr: "Trois incidents remontent au même problème." },
            { type: "ITIL", en: "change request", fr: "demande de changement (CR)", def: "Formalisation d'une modification d'infrastructure à soumettre au CAB (comité), avec plan de retour arrière.", exEn: "Every network change needs a change request.", exFr: "Chaque changement réseau exige une demande de changement." },
            { type: "ITIL", en: "knowledge base", fr: "base de connaissances", def: "Référentiel documenté (procédures, FAQ, runbooks) alimenté après résolution.", exEn: "Publish the fix into the knowledge base.", exFr: "Publie la solution dans la base de connaissances." },
            { type: "ITIL", en: "service desk", fr: "centre de services", def: "Point d'entrée unique des demandes et incidents utilisateurs (niveau 1).", exEn: "All tickets route through the service desk.", exFr: "Tous les tickets transitent par le centre de services." },
            { type: "ITIL", en: "CMDB", fr: "CMDB (base de données de configuration)", def: "Inventaire détaillé des éléments de configuration (CI) et de leurs relations.", exEn: "Update the CMDB when the server moves.", exFr: "Mets à jour la CMDB quand le serveur déménage." },

                            <text x="10" y="320" fill="#e0e0e0" fontSize="11" fontFamily="monospace">10   COMPTA       active    Fa0/1</text>
                        </svg>
                    </div>
                );
            }

            if (type === 'mockup-hyperv') {
                return (
                    <div className="w-full bg-slate-900 text-white p-4 rounded-lg overflow-x-auto">
                        <h4 className="text-xs uppercase font-bold text-sky-400 mb-1">Figure : Hyper-V Manager — interface de gestion des VM</h4>
                        <p className="text-[11px] text-slate-300 mb-2"><strong className="text-amber-300">Ce que vous voyez :</strong> à gauche les serveurs Hyper-V, au centre les VM (avec leur état Running/Off), à droite le panneau d'actions (Start, Connect, Checkpoint...). Ouvrez-le via <code>HV Manager</code> ou <em>Outils d'administration → Hyper-V Manager</em>.</p>
                        <svg viewBox="0 0 640 300" role="img" aria-label="Maquette Hyper-V Manager : serveurs, VM, actions" className="w-full h-auto text-xs rounded border border-slate-700">
                            <rect x="0" y="0" width="640" height="28" fill="#1e3a5f" />
                            <text x="8" y="18" fill="white" fontSize="11" fontWeight="bold">Hyper-V Manager</text>
                            <rect x="0" y="28" width="160" height="272" fill="#1a1a2e" stroke="#333" />
                            <text x="8" y="48" fill="#e0a020" fontSize="10" fontWeight="bold">Hyper-V Manager</text>
                            <text x="8" y="66" fill="#a0c0e0" fontSize="10">▸ SRV-HV (host)</text>
                            <text x="20" y="82" fill="#a0c0e0" fontSize="10">VMs</text>
                            <text x="20" y="98" fill="#a0c0e0" fontSize="10">Checkpoints</text>
                            <text x="20" y="114" fill="#a0c0e0" fontSize="10">Virtual Switches</text>
                            <rect x="160" y="28" width="280" height="272" fill="#0d0d1a" stroke="#333" />
                            <text x="170" y="48" fill="#e0a020" fontSize="10" fontWeight="bold">Virtual Machines</text>
                            <text x="170" y="68" fill="#60e060" fontSize="10">▶ VM-CLI01        Running</text>
                            <text x="170" y="84" fill="#8090a0" fontSize="10">○ VM-TEST         Off</text>
                            <text x="170" y="100" fill="#8090a0" fontSize="10">○ VM-SRV-DNS      Off</text>
                            <text x="170" y="124" fill="#a0c0e0" fontSize="10">CPU: 2 vCPU  Memory: 4 GB</text>
                            <text x="170" y="140" fill="#a0c0e0" fontSize="10">Disk: D:\VHD\VM-CLI01.vhdx (60 GB dynamic)</text>
                            <text x="170" y="156" fill="#a0c0e0" fontSize="10">Switch: LAN-EXT (External)</text>
                            <rect x="440" y="28" width="200" height="272" fill="#1a1a2e" stroke="#333" />
                            <text x="450" y="48" fill="#e0a020" fontSize="10" fontWeight="bold">Actions</text>
                            <text x="450" y="68" fill="#80c0e0" fontSize="10">New → Virtual Machine...</text>
                            <text x="450" y="86" fill="#80c0e0" fontSize="10">▶ Start</text>
                            <text x="450" y="104" fill="#80c0e0" fontSize="10">⏹ Turn Off</text>
                            <text x="450" y="122" fill="#80c0e0" fontSize="10">🔗 Connect...</text>
                            <text x="450" y="140" fill="#80c0e0" fontSize="10">📸 Checkpoint</text>
                            <rect x="160" y="200" width="280" height="80" fill="#1a2a1e" stroke="#2a5a3e" rx="4" />
                            <text x="170" y="218" fill="#60e080" fontSize="10" fontWeight="bold">💡 Ce qu'il faut observer :</text>
                            <text x="170" y="234" fill="#b0d0b0" fontSize="10">- L'état Running = la VM est démarrée et utilisable</text>
                            <text x="170" y="250" fill="#b0d0b0" fontSize="10">- Le panneau Actions propose Start, Connect, Checkpoint</text>
                            <text x="170" y="266" fill="#b0d0b0" fontSize="10">- "Connect" ouvre la console graphique de la VM</text>
                        </svg>
                    </div>
                );
            }

            return null;
        };

        // --- COMPOSANT DE BANQUE DE QCM (Mode Entraînement) ---
        const QcmSection = ({ qcmData, filterLabel, onFilterChange, filterOptions, showFilter, onSessionFinish }) => {
            // Modes FONC-10 : 'train' (entraînement) | 'chrono' (chronométré) | 'errors' (révision des erreurs)
            const [mode, setMode] = useState('train');
            const [chronoStarted, setChronoStarted] = useState(false);
            const [durationMin, setDurationMin] = useState(20);
            const [activeQcmIndex, setActiveQcmIndex] = useState(0);
            const [answers, setAnswers] = useState({});
            const [finished, setFinished] = useState(false);
            const [secondsLeft, setSecondsLeft] = useState(null);
            const [frozenErrors, setFrozenErrors] = useState(null);
            const [sessionPerCp, setSessionPerCp] = useState({});
            const [errorIds, setErrorIds] = useState(() => {
                try { return JSON.parse(localStorage.getItem('tssr_qcm_errors') || '[]'); } catch (e) { return []; }
            });

            const errorSet = new Set(errorIds);
            // En mode erreurs, on gèle la liste au démarrage pour que les indices restent stables
            const displayData = mode === 'errors' ? (frozenErrors === null ? qcmData.filter(q => errorSet.has(q.id)) : frozenErrors) : qcmData;

            const resetSession = () => {
                setActiveQcmIndex(0);
                setAnswers({});
                setFinished(false);
                setSecondsLeft(null);
                setChronoStarted(false);
                setFrozenErrors(null);
            };

            // Reprendre à la première question quand le filtre ou le mode change
            useEffect(() => {
                resetSession();
            }, [mode, qcmData, filterLabel]);

            const persistErrors = (ids) => {
                setErrorIds(ids);
                try { localStorage.setItem('tssr_qcm_errors', JSON.stringify(ids)); } catch (e) { /* stockage indisponible */ }
            };

            // Chronomètre (tick 1 s, s'arrête quand le temps est épuisé)
            useEffect(() => {
                if (mode !== 'chrono' || !chronoStarted || finished) return undefined;
                const t = setInterval(() => setSecondsLeft(s => (s === null ? null : Math.max(0, s - 1))), 1000);
                return () => clearInterval(t);
            }, [mode, chronoStarted, finished]);

            const finishSession = () => {
                setFinished(true);
                // Mise à jour de la liste d'erreurs : on ajoute les ratées, on retire celles réussies
                const currentIds = new Set(displayData.map(q => q.id));
                const wrong = displayData
                    .map((q, i) => ({ q, i }))
                    .filter(x => answers[x.i] !== undefined && !x.q.options[answers[x.i]].correct)
                    .map(x => x.q.id);
                const right = displayData
                    .map((q, i) => ({ q, i }))
                    .filter(x => answers[x.i] !== undefined && x.q.options[answers[x.i]].correct)
                    .map(x => x.q.id);
                const kept = errorIds.filter(id => !(currentIds.has(id) && right.includes(id)));
                persistErrors(Array.from(new Set([...kept, ...wrong])));
                // Score par compétence / domaine (FONC-15)
                const perCp = {};
                displayData.forEach((q, i) => {
                    if (answers[i] === undefined) return;
                    if (!perCp[q.cp]) perCp[q.cp] = { correct: 0, total: 0 };
                    perCp[q.cp].total += 1;
                    if (q.options[answers[i]].correct) perCp[q.cp].correct += 1;
                });
                if (onSessionFinish) {
                    try { onSessionFinish(JSON.parse(JSON.stringify(perCp)), mode === 'chrono' ? 'chrono' : 'entrainement'); } catch (e) { /* pas de blocage */ }
                }
                setSessionPerCp(JSON.parse(JSON.stringify(perCp)));
            };

            // Fin automatique quand le chrono atteint zéro
            useEffect(() => {
                if (mode === 'chrono' && chronoStarted && secondsLeft === 0 && !finished) finishSession();
            }, [secondsLeft]);

            const safeIdx = Math.min(activeQcmIndex, Math.max(displayData.length - 1, 0));
            const currentQcm = displayData[safeIdx];
            const answeredHere = answers[safeIdx];

            const answerTrain = (optIdx) => {
                if (answeredHere !== undefined || finished) return;
                const ok = currentQcm.options[optIdx].correct;
                setAnswers(prev => ({ ...prev, [safeIdx]: optIdx }));
                // Entraînement / erreurs : correction immédiate + suivi des erreurs
                const id = currentQcm.id;
                const nextIds = ok ? errorIds.filter(x => x !== id) : Array.from(new Set([...errorIds, id]));
                persistErrors(nextIds);
            };

            const answerChrono = (optIdx) => {
                if (finished) return;
                setAnswers(prev => ({ ...prev, [safeIdx]: optIdx }));
            };

            if (!currentQcm) {
                return (
                    <div className="max-w-3xl mx-auto bg-white dark:bg-slate-800 rounded-xl p-10 border border-slate-200 dark:border-slate-700 shadow-sm text-center space-y-3">
                        <div className="w-14 h-14 mx-auto rounded-full bg-amber-500/10 text-amber-500 flex items-center justify-center text-2xl">✍️</div>
                        {mode === 'errors' ? (
                            <React.Fragment>
                                <h3 className="text-lg font-bold text-slate-900 dark:text-white">Aucune erreur à revoir 👍</h3>
                                <p className="text-xs text-slate-500 dark:text-slate-400">Le mode « Révision des erreurs » regroupe les questions ratées dans vos dernieres sessions. Passez une session en mode Entraînement : vos erreurs apparaîtront ici.</p>
                            </React.Fragment>
                        ) : (
                            <React.Fragment>
                                <h3 className="text-lg font-bold text-slate-900 dark:text-white">Aucune question pour ce filtre</h3>
                                <p className="text-xs text-slate-500 dark:text-slate-400">Choisissez « Toutes les questions » ou un autre sujet pour réviser.</p>
                            </React.Fragment>
                        )}
                    </div>
                );
            }

            const modeButton = (value, icon, label) => (
                <button
                    onClick={() => { setMode(value); }}
                    aria-pressed={mode === value}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-colors ${
                        mode === value
                            ? 'bg-brand-600 text-white'
                            : 'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600'
                    }`}
                >
                    {icon} {label}
                </button>
            );

            const modeTitle = finished
                ? 'Résultats de la session'
                : (mode === 'chrono' ? 'Banque QCM (Mode Chronométré)' : mode === 'errors' ? 'Banque QCM (Révision des erreurs)' : 'Banque QCM (Mode Entraînement)');

            // --- Vue résultats (fin de session, auto ou manuelle) ---
            if (finished) {
                const answeredCount = Object.keys(answers).length;
                const correctCount = displayData.reduce((n, q, i) => (answers[i] !== undefined && q.options[answers[i]].correct ? n + 1 : n), 0);
                const pct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
                return (
                    <div className="max-w-3xl mx-auto bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-6">
                        <div className="border-b border-slate-200 dark:border-slate-700 pb-4">
                            <h3 className="text-xl font-bold text-slate-900 dark:text-white">Résultats de la session</h3>
                            <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                                {correctCount} bonne{correctCount > 1 ? 's' : ''} réponse{correctCount > 1 ? 's' : ''} sur {answeredCount} répondue{answeredCount > 1 ? 's' : ''} — score : {pct} %.
                                {mode === 'chrono' && ' Le chrono a été arrêté, comme le jour de l\'examen.'}
                            </p>
                            <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">Les questions ratées sont enregistrées : elles vous seront reproposées par le mode « Révision des erreurs ».</p>
                        </div>
                        <div className="space-y-2">
                            <h3 className="text-xs uppercase font-bold text-sky-500 tracking-wider">Score par compétence / domaine (cette session)</h3>
                            {Object.keys(sessionPerCp).length === 0 ? (
                                <p className="text-xs text-slate-500 dark:text-slate-400">Aucune question répondue — rien à afficher.</p>
                            ) : (
                                <div className="flex flex-wrap gap-2">
                                    {Object.entries(sessionPerCp).map(([cp, r]) => {
                                        const p = Math.round((r.correct / r.total) * 100);
                                        return (
                                            <span key={cp} className={`text-xs font-bold px-3 py-1 rounded-full border ${
                                                p >= 80
                                                    ? 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/30'
                                                    : p >= 50
                                                        ? 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-500/30'
                                                        : 'bg-rose-500/10 text-rose-600 dark:text-rose-400 border-rose-500/30'
                                            }`}>
                                                {cp} : {r.correct}/{r.total} ({p} %)
                                            </span>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                        <div className="space-y-3">
                            {displayData.map((q, i) => (
                                <div key={q.id} className="p-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 space-y-2">
                                    <p className="text-sm font-semibold text-slate-800 dark:text-slate-200">
                                        <span className="text-[10px] font-mono text-sky-500 mr-2">[{q.cp}]</span>{q.question}
                                    </p>
                                    {answers[i] === undefined ? (
                                        <p className="text-xs text-amber-600 dark:text-amber-400 font-semibold">⚠️ Sans réponse</p>
                                    ) : (
                                        <p className={`text-xs font-semibold ${q.options[answers[i]].correct ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}`}>
                                            {q.options[answers[i]].correct ? '✓ Bonne réponse' : '✗ Mauvaise réponse'}
                                        </p>
                                    )}
                                    <ul className="space-y-1">
                                        {q.options.map((opt, idx) => (
                                            <li key={idx} className={`text-xs ${
                                                opt.correct
                                                    ? 'text-emerald-700 dark:text-emerald-300 font-semibold'
                                                    : (answers[i] === idx ? 'text-rose-700 dark:text-rose-300' : 'text-slate-600 dark:text-slate-400')
                                            }`}>
                                                {String.fromCharCode(65 + idx)}. {opt.text}{opt.correct ? ' ✓' : (answers[i] === idx ? ' ← votre choix' : '')}
                                            </li>
                                        ))}
                                    </ul>
                                    <div className="text-xs p-2 rounded bg-slate-100 dark:bg-slate-900/80 text-slate-600 dark:text-slate-400 border-l-2 border-slate-400">
                                        <span className="font-bold">Explication : </span>{q.options.find(o => o.correct) ? q.options.find(o => o.correct).exp : ''}
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="flex justify-between items-center pt-4 border-t border-slate-200 dark:border-slate-700">
                            <button
                                onClick={resetSession}
                                className="px-4 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-lg text-xs font-semibold hover:bg-slate-200 dark:hover:bg-slate-600"
                            >
                                ↻ Recommencer une session
                            </button>
                        </div>
                    </div>
                );
            }

            // --- Vue chrono : écran de lancement tant que le test n'a pas commencé ---
            const chronoLaunch = (mode === 'chrono' && !chronoStarted);
            const mm = secondsLeft === null ? '--' : String(Math.floor(secondsLeft / 60)).padStart(2, '0');
            const ss = secondsLeft === null ? '--' : String(secondsLeft % 60).padStart(2, '0');

            return (
                <div className="max-w-3xl mx-auto bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-6">
                    <div className="flex flex-wrap gap-3 justify-between items-center border-b border-slate-200 dark:border-slate-700 pb-4">
                        <div>
                            <span className="text-xs font-bold text-sky-500">{currentQcm.certif} · {currentQcm.cp}</span>
                            <h3 className="text-xl font-bold text-slate-900 dark:text-white mt-1">{modeTitle}</h3>
                        </div>
                        <div className="flex items-center gap-3">
                            {showFilter && (
                                <select
                                    value={filterLabel}
                                    onChange={(e) => onFilterChange(e.target.value)}
                                    aria-label="Filtrer les questions par sujet"
                                    className="bg-slate-100 dark:bg-slate-900 text-xs text-slate-700 dark:text-slate-300 rounded border border-slate-200 dark:border-slate-700 px-2 py-1.5"
                                >
                                    {filterOptions.map(opt => (
                                        <option key={opt.value} value={opt.value}>{opt.label}</option>
                                    ))}
                                </select>
                            )}
                            <span className="text-xs font-mono bg-slate-100 dark:bg-slate-700 px-3 py-1 rounded-full text-slate-600 dark:text-slate-300">
                                Question {safeIdx + 1} / {displayData.length}
                            </span>
                        </div>
                    </div>

                    {/* Sélecteur de mode (FONC-10) */}
                    {showFilter && (
                        <div className="flex flex-wrap gap-2" role="group" aria-label="Mode de révision">
                            {modeButton('train', '🎓', 'Entraînement')}
                            {modeButton('chrono', '⏱️', 'Chronométré')}
                            {modeButton('errors', '🔁', 'Révision des erreurs')}
                        </div>
                    )}

                    {chronoLaunch ? (
                        <div className="p-6 bg-slate-50 dark:bg-slate-900/50 rounded-xl border border-slate-200 dark:border-slate-700 space-y-4 text-center">
                            <p className="text-sm font-semibold text-slate-800 dark:text-slate-200">Test chronométré sur les questions filtrées ({displayData.length} question{displayData.length > 1 ? 's' : ''}).</p>
                            <p className="text-xs text-slate-500 dark:text-slate-400">Durée de l'examen blanc : {durationMin} minutes. La correction et les explications ne s'affichent qu'à la fin. Les questions sans réponse sont comptées comme ratées.</p>
                            <div className="flex flex-wrap justify-center items-center gap-3">
                                <label htmlFor="chrono-duration" className="text-xs font-bold text-slate-600 dark:text-slate-300">Durée :</label>
                                <select
                                    id="chrono-duration"
                                    value={durationMin}
                                    onChange={(e) => setDurationMin(parseInt(e.target.value, 10))}
                                    className="bg-slate-100 dark:bg-slate-900 text-xs text-slate-700 dark:text-slate-300 rounded border border-slate-200 dark:border-slate-700 px-2 py-1.5"
                                >
                                    <option value="20">20 minutes</option>
                                    <option value="30">30 minutes</option>
                                    <option value="45">45 minutes</option>
                                    <option value="90">1 h 30</option>
                                    <option value="120">2 heures</option>
                                </select>
                                <button
                                    onClick={() => { setChronoStarted(true); setSecondsLeft(durationMin * 60); }}
                                    className="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-xs font-bold transition-colors"
                                >
                                    ▶ Démarrer le test
                                </button>
                            </div>
                            <p className="text-[10px] text-slate-400">Rappel : un entraînement chronométré n'a aucune valeur de certification.</p>
                        </div>
                    ) : (
                        <React.Fragment>
                            {mode === 'chrono' && (
                                <div className="flex flex-wrap items-center justify-between gap-3 p-3 rounded-lg border border-purple-500/30 bg-purple-500/10">
                                    <span className="text-xs font-bold text-purple-700 dark:text-purple-300">⏱️ Temps restant : <span className="font-mono text-base">{mm}:{ss}</span></span>
                                    <span className="text-[10px] text-slate-500 dark:text-slate-400">Le test s'arrête automatiquement à 00:00.</span>
                                </div>
                            )}

                            <div className="text-base font-semibold text-slate-800 dark:text-slate-100">
                                {currentQcm.question}
                            </div>

                            <div className="space-y-3">
                                {currentQcm.options.map((opt, idx) => {
                                    const isSelected = answeredHere === idx;
                                    let btnStyle = "bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200 hover:border-brand-500";

                                    if (answeredHere !== undefined && mode !== 'chrono') {
                                        if (opt.correct) {
                                            btnStyle = "bg-emerald-500/10 border-emerald-500 text-emerald-700 dark:text-emerald-300 font-medium";
                                        } else if (isSelected && !opt.correct) {
                                            btnStyle = "bg-rose-500/10 border-rose-500 text-rose-700 dark:text-rose-300 font-medium";
                                        }
                                    } else if (isSelected && mode === 'chrono') {
                                        btnStyle = "bg-purple-500/10 border-purple-500 text-purple-700 dark:text-purple-300 font-medium";
                                    }

                                    return (
                                        <div key={idx} className="space-y-2">
                                            <button
                                                onClick={() => (mode === 'chrono' ? answerChrono(idx) : answerTrain(idx))}
                                                className={`w-full text-left p-4 rounded-lg border text-sm transition-all flex items-start justify-between ${btnStyle}`}
                                            >
                                                <span>{String.fromCharCode(65 + idx)}. {opt.text}</span>
                                                {answeredHere !== undefined && mode !== 'chrono' && opt.correct && (
                                                    <span className="text-emerald-500 font-bold text-xs">✓ Correct</span>
                                                )}
                                            </button>

                                            {answeredHere !== undefined && mode !== 'chrono' && (
                                                <div className="text-xs p-3 rounded bg-slate-100 dark:bg-slate-900/80 text-slate-600 dark:text-slate-400 ml-4 border-l-2 border-slate-400">
                                                    <span className="font-bold">Explication : </span>{opt.exp}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="flex flex-wrap justify-between items-center gap-3 pt-4 border-t border-slate-200 dark:border-slate-700">
                                <button
                                    disabled={safeIdx === 0}
                                    onClick={() => setActiveQcmIndex(prev => Math.max(0, prev - 1))}
                                    className="px-4 py-2 bg-slate-100 dark:bg-slate-700 disabled:opacity-50 text-slate-700 dark:text-slate-300 rounded-lg text-xs font-semibold"
                                >
                                    Question précédente
                                </button>
                                <div className="flex flex-wrap gap-3">
                                    <button
                                        onClick={finishSession}
                                        className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold transition-colors"
                                        title={mode === 'chrono' ? 'Arrêter le test maintenant et voir le score' : 'Arrêter ici et voir votre score'}
                                    >
                                        {mode === 'chrono' ? '⏹️ Terminer le test' : '✓ Terminer la session'}
                                    </button>
                                    <button
                                        disabled={safeIdx === displayData.length - 1}
                                        onClick={() => setActiveQcmIndex(prev => Math.min(displayData.length - 1, prev + 1))}
                                        className="px-4 py-2 bg-brand-600 hover:bg-brand-700 disabled:opacity-50 text-white rounded-lg text-xs font-semibold"
                                    >
                                        Question suivante
                                    </button>
                                </div>
                            </div>
                        </React.Fragment>
                    )}
                </div>
            );
        };

        // --- COMPOSANTS POUR LES COURS A LEÇONS (TSSR / AIS PAR CP) ---
        const CorrigeMasque = ({ texte }) => {

            // États de recherche indépendants pour chaque onglet distinct
            const [glossarySearch, setGlossarySearch] = useState('');
            const [cheatSheetSearch, setCheatSheetSearch] = useState('');
            const [vocabSearch, setVocabSearch] = useState('');
            const [vocabCat, setVocabCat] = useState('Tous');
            const [cmdSys, setCmdSys] = useState('Tous');

                try { return new Set(JSON.parse(localStorage.getItem('tssr_cmd_favorites') || '[]')); } catch (e) { return new Set(); }
            });
            const toggleCmdFavorite = (id) => {
                setCmdFavorites(prev => {
                    const n = new Set(prev);
                    if (n.has(id)) n.delete(id); else n.add(id);
                    try { localStorage.setItem('tssr_cmd_favorites', JSON.stringify([...n])); } catch (e) {}
                    return n;
                });
            };
            const [copiedCmd, setCopiedCmd] = useState(null);
            const copyCmd = (el, id) => {
                const txt = (el.ex || el.cmd || '').toString();
                const done = () => { setCopiedCmd(id); setTimeout(() => setCopiedCmd(c => (c === id ? null : c)), 1600); };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(txt).then(done).catch(() => {
                        try { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done(); } catch (e2) {}
                    });
                } else {
                    try { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done(); } catch (e) {}
                }
            };
            const [glossCertif, setGlossCertif] = useState('Tous'); // FONC-12 : filtre par certification
            const [labParcours, setLabParcours] = useState('Tous');
            const [labLevel, setLabLevel] = useState('Tous');
            const [labSearch, setLabSearch] = useState('');
            const [selectedLabId, setSelectedLabId] = useState(null);
            const [labChecklist, setLabChecklist] = useState(() => {
                try { return JSON.parse(localStorage.getItem('tssr_lab_checklist') || '{}'); } catch (e) { return {}; }
            });
            const toggleLabStep = (labId, stepNum) => {
                setLabChecklist(prev => {
                    const done = new Set(prev[labId] || []);
                    if (done.has(stepNum)) done.delete(stepNum); else done.add(stepNum);
                    const next = { ...prev, [labId]: [...done] };
                    try { localStorage.setItem('tssr_lab_checklist', JSON.stringify(next)); } catch (e) {}
                    return next;
                });
            };
            const [labDone, setLabDone] = useState(() => {
                try { return new Set(JSON.parse(localStorage.getItem('tssr_lab_done') || '[]')); } catch (e) { return new Set(); }
            });
            const toggleLabDone = (labId) => {
                setLabDone(prev => {

                });

            // Normalisation des catégories du vocabulaire
            const normVocabType = (t) => ({

                "Système": "Linux",
                "Sécurité": "Cybersécurité"

            const [logoError, setLogoError] = useState(false);

            // Filtre de la banque QCM : par sujet lié au cours, par certification (version CCNA choisie), ou tout
            const filteredQcm = useMemo(() => {
                if (qcmFilter === 'ALL') return QCM_DATA;
                if (qcmFilter === 'CCNA') return QCM_DATA.filter(q => q.certif && q.certif === 'CCNA');
                return QCM_DATA.filter(q => q.cp === qcmFilter);
            }, [qcmFilter, ccnaVersion]);

            const qcmFilterOptions = useMemo(() => {
                const seen = new Set();
                const options = [{ value: 'ALL', label: 'Toutes les questions' }, { value: 'CCNA', label: 'CCNA ' + ccnaVersion }];
                QCM_DATA.forEach(q => {
                    if (!seen.has(q.cp)) {
                        seen.add(q.cp);
                        options.push({ value: q.cp, label: `Sujet ${q.cp}` });
                    }
                });
                return options;
            }, []);


            const filteredCourses = useMemo(() => {
                return ALL_MODULE_ENTRIES.filter(c => {
                    // Filtrage par parcours sélectionné si activé
                    if (courseFilter === 'CCNA' && !c.parcours.startsWith('CCNA')) return false;
                    if (courseFilter === 'TSSR' && c.parcours !== 'TSSR') return false;
                    if (courseFilter === 'AIS' && c.parcours !== 'AIS') return false;
                    // FONC-03 : dans « Tous les parcours », n'afficher que la version CCNA sélectionnée
                    if (c.parcours && c.parcours.startsWith('CCNA') && c.parcours !== 'CCNA') return false;

                    if (searchQuery) {
                        const q = normText(searchQuery);
                        const text = [
                            c.title, c.code, c.why,
                            ...(c.keywords || []),
                            ...(c.lessons || []).map(l => [l.title, l.objectives && l.objectives.join(' '), l.content && (typeof l.content === 'string' ? l.content : JSON.stringify(l.content))].join(' ')),
                            ...(c.steps || []).map(s => [s.title, s.why, s.cli, s.gui].join(' ')),
                            ...(c.schemas || []).map(s => s.title)
                        ].join(' ');
                        return normText(text).includes(q);

                    return true;
                });

            // Aide au résultat : précise si le terme cherché existe dans les autres rubriques (Glossaire / Commandes / Vocabulaire)
            const searchHints = useMemo(() => {
                if (!searchQuery) return null;
                const q = normText(searchQuery);

                    inGloss: GLOSSARY_DATA.filter(g => [g.term, g.en, g.def].some(t => normText(t).includes(q))).length,
                    inCmds: CHEAT_SHEETS.reduce((n, s) => n + s.commands.filter(c => [c.cmd, c.desc].some(t => normText(t).includes(q))).length, 0),
                    inVocab: ENGLISH_VOCAB.filter(v => [v.en, v.fr, v.exEn].some(t => normText(t).includes(q))).length
                };
            }, [searchQuery]);

            // Ordre des cours à leçons (TSSR CP1→CP9 puis AIS CP1→CP10) pour la navigation précédent/suivant
            const lessonCourses = ALL_MODULE_ENTRIES.filter(c => c.lessons);
            const lessonIdx = lessonCourses.findIndex(c => c.id === selectedCourse.id);
            const prevLesson = lessonIdx > 0 ? lessonCourses[lessonIdx - 1] : null;
            const nextLesson = lessonIdx >= 0 && lessonIdx < lessonCourses.length - 1 ? lessonCourses[lessonIdx + 1] : null;

            // Navigation précédent/suivant sur toutes les fiches, y compris CCNA (FONC-25)
            const entryIdx = ALL_MODULE_ENTRIES.findIndex(c => c.id === selectedCourse.id);

                        site: 'plateforme-tssr-ais-ccna',
                        exportedAt: new Date().toISOString(),
                        progress,
                        examDate,
                        ccnaVersion,
                        qcmErrors: errors

                    const blob = new Blob([data], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'progression_tssr_ais_ccna.json';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                            throw new Error('fichier invalide (progression introuvable)');
                        }
                        setProgress({ completedModules: [], qcmScores: {}, notes: {}, ...(parsed.progress) });
                        if (parsed.examDate) setExamDate(parsed.examDate);
                        if (parsed.ccnaVersion === 'v1.1' || parsed.ccnaVersion === 'v2.0') setCcnaVersion(parsed.ccnaVersion);

                            <h3 className="font-bold text-sm text-slate-900 dark:text-white">Questionnaire Pro</h3>
                            <p className="text-xs text-slate-500">Durée officielle : 2 h 30 min</p>
                            <button disabled className="w-full py-2 bg-slate-200 dark:bg-slate-700 text-slate-500 dark:text-slate-400 rounded text-xs font-bold cursor-not-allowed">En préparation</button>
                            <p className="text-[10px] text-slate-400">Le simulateur AIS sera proposé plus loin dans le parcours.</p>
                        </div>

                        <div className="p-4 bg-slate-50 dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 text-center space-y-2">
                            <span className="text-xs font-bold text-purple-500">Cisco CCNA</span>
                            <h3 className="font-bold text-sm text-slate-900 dark:text-white">Certification 200-301</h3>
                            <p className="text-xs text-slate-500">Durée réelle : 120 min (100 QCM)</p>
                            <button
                                onClick={() => {
                                    setQcmFilter('CCNA');
                                    setCurrentTab('qcm');
                                }}
                                className="w-full py-2 bg-purple-600 hover:bg-purple-700 text-white rounded text-xs font-bold transition-colors"
                            >
                                Entraînement QCM CCNA
                            </button>
                            <p className="text-[10px] text-slate-400">Cliquez « Entraînement QCM CCNA », puis dans la Banque QCM choisissez le mode ⏱️ Chronométré (durée au choix, jusqu'à 2 heures) pour un test aux rythmes officiels.</p>
                        </div>
                    </div>

                    <div className="p-3 bg-amber-500/10 border border-amber-500/20 text-amber-700 dark:text-amber-400 text-xs rounded-lg">
                        <strong>Avertissement :</strong> Cet examen blanc n'a pas de valeur de certification officielle. Il constitue un outil d'entrainement autonome.
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
                            {/* Logo + titre cliquables : retour au Dashboard depuis n'importe quelle page */}
                            <button
                                onClick={() => { setCurrentTab('dashboard'); window.scrollTo({ top: 0 }); }}
                                aria-label="Retour à l'accueil (Dashboard)"
                                title="Retour au Dashboard"
                                className="flex items-center gap-3 text-left rounded-lg px-2 py-1 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500"
                            >
                                {!logoError ? (
                                    <img
                                        src="logo.png"
                                        alt="Logo Cours IT"
                                        onError={() => setLogoError(true)}
                                        className="h-9 w-auto object-contain transition-opacity duration-200 rounded"
                                    />
                                ) : (
                                    <div className="w-9 h-9 rounded-lg bg-gradient-to-tr from-brand-700 to-sky-500 text-white flex items-center justify-center font-bold text-base shadow-md">
                                        IT
                                    </div>
                                )}
                                <div>
                                    <h1 className="font-bold text-base text-slate-900 dark:text-white">CoursIT</h1>
                                    <span className="text-[11px] text-slate-500 dark:text-slate-400">Plateforme TSSR · AIS · CCNA — cliquer pour revenir à l'accueil</span>
                                </div>
                            </button>

                            {/* Barre de Recherche Plein Texte Dynamic */}
                            <div className="w-full md:w-72">
                                <input
                                    type="text"
                                    aria-label="Rechercher un cours, un mot-clé"
                                    placeholder="🔍 Rechercher un cours ou mot-clé (titre, code, sommaire...)"
                                    value={searchQuery}
                                    onChange={(e) => { setSearchQuery(e.target.value); if (currentTab !== 'courses') setCurrentTab('courses'); }}
                                    className="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-900 dark:text-slate-100 focus:outline-none focus:border-brand-500"
                                />
                                {searchQuery && (
                                    <p className="text-[10px] mt-1 text-slate-500 dark:text-slate-400" role="status">
                                        🔎 « {searchQuery} » : {filteredCourses.length} cours correspondant(s) dans l'onglet « Cours » (titres, codes, descriptions et sommaires).
                                        {filteredCourses.length === 0 && searchHints && (searchHints.inGloss + searchHints.inCmds + searchHints.inVocab) > 0 && (
                                            <span className="text-brand-500 font-semibold"> · Le terme existe par ailleurs : Glossaire ({searchHints.inGloss}), Commandes ({searchHints.inCmds}), Vocabulaire ({searchHints.inVocab}).</span>
                                        )}
                                        {filteredCourses.length === 0 && (searchHints === null || (searchHints.inGloss + searchHints.inCmds + searchHints.inVocab) === 0) && (
                                            <span> · Aucune correspondance ailleurs dans le site.</span>
                                        )}
                                    </p>
                                )}
                            </div>

                            <div className="flex items-center gap-3">
                                {/* Réglage de la taille de police (FONC-22) */}
                                <div className="flex items-center gap-1" role="group" aria-label="Taille de la police">
                                    <button
                                        onClick={() => setFontScale('93')}
                                        aria-label="Police plus petite"
                                        title="Réduire la taille du texte"
                                        className="px-2 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold hover:bg-slate-200 dark:hover:bg-slate-600"
                                    >
                                        A−
                                    </button>
                                    <button
                                        onClick={() => setFontScale('110')}
                                        aria-label="Police plus grande"
                                        title="Augmenter la taille du texte"
                                        className="px-2 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold hover:bg-slate-200 dark:hover:bg-slate-600"
                                    >
                                        A+
                                    </button>
                                    <button
                                        onClick={() => setFontScale('100')}
                                        aria-label="Taille de police normale"
                                        title="Taille normale"
                                        className="px-2 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold hover:bg-slate-200 dark:hover:bg-slate-600"
                                    >
                                        A
                                    </button>
                                </div>
                                <button
                                    onClick={() => setDarkMode(!darkMode)}
                                    aria-label={darkMode ? 'Passer en mode clair' : 'Passer en mode sombre'}
                                    title={darkMode ? 'Mode clair' : 'Mode sombre'}
                                    className="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors"
                                >
                                    {darkMode ? '☀️' : '🌙'}
                                </button>
                            </div>
                        </div>

                        {/* Navigation principale finale */}
                        <nav aria-label="Navigation principale" className="bg-slate-50 dark:bg-slate-900/80 border-t border-slate-200 dark:border-slate-800">
                            <div className="max-w-7xl mx-auto px-4 flex space-x-1 overflow-x-auto text-xs font-medium py-2">
                                {[
                                    { id: 'dashboard', label: '🏠 Dashboard' },
                                    { id: 'courses', label: '📚 Cours & Fiches' },
                                    { id: 'qcm', label: '✍️ Banque QCM' },
                                    { id: 'labs', label: '🧪 Labos Guidés' },
                                    { id: 'exam', label: '⏱️ Examen Blanc' },
                                    { id: 'commands', label: '⚙️ Commandes' },
                                    { id: 'depannage', label: '\u{1F9F0} Dépannage' },
                                    { id: 'glossary', label: '📖 Glossaire' },
                                    { id: 'vocab', label: '🌐 Vocabulaire Anglais' }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setCurrentTab(tab.id)}
                                        aria-current={currentTab === tab.id ? 'page' : undefined}
                                        className={`px-3 py-2 rounded-lg whitespace-nowrap transition-colors ${
                                            currentTab === tab.id
                                                ? 'bg-brand-600 text-white font-bold'
                                                : 'text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800'
                                        }`}
                                    >
                                        {tab.label}
                                    </button>
                                ))}
                            </div>
                        </nav>
                    </header>

                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6 pb-24 md:pb-6">
                        {currentTab === 'dashboard' && renderDashboard()}
                        {currentTab === 'courses' && renderCourses()}
                        {currentTab === 'qcm' && renderQCM()}
                        {currentTab === 'labs' && renderLabs()}
                        {currentTab === 'exam' && renderExam()}
                        {currentTab === 'commands' && renderCommandsTab()}
                        {currentTab === 'depannage' && renderDepannageTab()}
                        {currentTab === 'glossary' && renderGlossaryTab()}
                        {currentTab === 'vocab' && renderVocabTab()}
                    </main>

                    {/* Navigation rapide fixe — mobile uniquement */}
                    <nav aria-label="Navigation rapide mobile" className="md:hidden fixed bottom-0 inset-x-0 z-50 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-700 shadow-[0_-2px_10px_rgba(0,0,0,0.08)]">
                        <div className="grid grid-cols-5 text-[10px] font-semibold">
                            {[
                                { id: 'dashboard', icon: '🏠', label: 'Accueil' },
                                { id: 'courses', icon: '📚', label: 'Cours' },
                                { id: 'qcm', icon: '✍️', label: 'QCM' },
                                { id: 'labs', icon: '🧪', label: 'Labos' },
                                { id: 'glossary', icon: '📖', label: 'Glossaire' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setCurrentTab(tab.id)}
                                    aria-current={currentTab === tab.id ? 'page' : undefined}
                                    className={`py-2 flex flex-col items-center gap-0.5 min-h-[52px] transition-colors ${
                                        currentTab === tab.id
                                            ? 'text-brand-600 dark:text-sky-300 bg-brand-500/10'
                                            : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'
                                    }`}
                                >
                                    <span className="text-base" aria-hidden="true">{tab.icon}</span>
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                    </nav>

                    <footer className="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 py-4 text-xs text-slate-500 dark:text-slate-400 space-y-3">
                        <div className="max-w-7xl mx-auto px-4 flex flex-wrap gap-3 justify-between items-center">
                            <span>Plateforme de révision autonome TSSR, AIS et CCNA 200-301 · Contenu vérifié le {CONTENT_LAST_CHECK}</span>
                            <div className="flex gap-3">
                                <button onClick={reportIssue} className="font-semibold text-amber-600 dark:text-amber-400 hover:underline">
                                    ⚠️ Signaler une erreur dans cette page
                                </button>
                            </div>
                        </div>
                        <details className="max-w-7xl mx-auto px-4">
                            <summary className="cursor-pointer font-semibold text-slate-600 dark:text-slate-300">Mentions légales & confidentialité (NF-11)</summary>
                            <div className="mt-2 space-y-1 leading-relaxed">
                                <p><strong>Éditeur :</strong> site de révision édité à titre personnel par son constructeur, à des fins pédagogiques. Coordonnées de l'éditeur : à compléter (e-mail de contact à renseigner ici).</p>
                                <p><strong>Hébergement :</strong> usage local ou hébergement statique (GitHub Pages ou équivalent) ; aucune donnée personnelle n'est transmise à un serveur par ce site.</p>
                                <p><strong>Confidentialité (RGPD, NF-10) :</strong> votre progression, vos scores et vos listes d'erreurs sont stockés uniquement dans votre navigateur (localStorage). Vous pouvez les exporter en un fichier JSON, les ré-importer, ou les effacer depuis la carte « Mon suivi ».</p>
                                <p><strong>Avertissement :</strong> les examens blancs et QCM n'ont aucune valeur de certification. Contenus rédigés pour ce site ; les référentiels officiels (TP-01351, TP-01352, blueprint Cisco) sont cités, jamais recopiés.</p>
                            </div>
                        </details>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
